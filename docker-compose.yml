# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: athletech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-athletech}
      POSTGRES_USER: ${DB_USER:-athletech_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-athletech_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-athletech_user} -d ${DB_NAME:-athletech}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athletech_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 60 config.wsgi:application"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-prod-key-change-me}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 backend"
      DATABASE_NAME: ${DB_NAME:-athletech}
      DATABASE_USER: ${DB_USER:-athletech_user}
      DATABASE_PASSWORD: ${DB_PASSWORD:-athletech_secure_pass}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athletech_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume: